[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drle"
version = "0.1.0"
description = "Deterministic Relational Language Engine prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = ["datasets>=2.19", "pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
drle = "drle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
